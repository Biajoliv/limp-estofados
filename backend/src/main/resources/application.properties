spring.application.name=backend

# Banco de dados - lido via variáveis de ambiente, com fallback para desenvolvimento local
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:limpeza_estofados}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate - nunca cria/altera schema sozinho, isso é responsabilidade do Flyway (migrations) - melhoria futura
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# E-mail (SMTP) - lido via variáveis de ambiente, sem fallback para usuário/senha (não faz sentido ter senha padrão)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
